# CASE FILE VP-26-001 · Netlify configuration
#
# The build step does three things (see scripts/build.sh):
#   1. verifies the hash of the single inline script matches the CSP below
#   2. injects Subresource Integrity attributes for /styles.css and /main.js
#   3. writes /integrity.json with the SHA-256 of the published files
#
# The header block is the single source of truth for security headers.
# scripts/serve.py reads this file and applies the same headers locally.

[build]
  publish = "."
  command = "sh scripts/build.sh"

[build.processing]
  skip_processing = true   # never let the platform rewrite HTML/CSS/JS: hashes must stay stable

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-ZfINbhOCXLqWs5/Qzg63HcHtY2dSsO7Wtbf2zIGNvVc='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; manifest-src 'self'; require-trusted-types-for 'script'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), browsing-topics=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/exhibit-0/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sent/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Netlify serves /404.html for unknown paths automatically.
